name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          SUFFIX=""
          if [ "${{ matrix.goos }}" = "windows" ]; then SUFFIX=".exe"; fi
          go build -ldflags="-s -w" -o "disk-cloner-${{ matrix.goos }}-${{ matrix.goarch }}$SUFFIX" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-cloner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: disk-cloner-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            disk-cloner-linux-amd64/disk-cloner-linux-amd64
            disk-cloner-windows-amd64/disk-cloner-windows-amd64.exe
          generate_release_notes: true
